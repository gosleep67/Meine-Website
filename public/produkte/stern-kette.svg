<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".85"><stop offset="0" stop-color="#f7f2ea"/><stop offset="1" stop-color="#ddd2c3"/></radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c3c8cf"/><stop offset="1" stop-color="#868d98"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e3f0fa"/><stop offset="1" stop-color="#b4d2e8"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <path id="arc" d="M90 70 C90 330 310 330 310 70"/>
    <path id="spark" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9Z"/>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <use href="#arc" transform="translate(5 9)" fill="none" stroke="#5a4630" stroke-opacity=".28" stroke-width="5" filter="url(#blur)"/>
  <use href="#arc" fill="none" stroke="url(#silver)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="5 1.8"/>
  <g fill="url(#stone)" stroke="url(#silver)" stroke-width="1" stroke-linejoin="round">
    <use href="#spark" transform="translate(113 195) scale(1.9)"/>
    <use href="#spark" transform="translate(152 247) scale(1.9)"/>
    <use href="#spark" transform="translate(200 265) scale(2.1)"/>
    <use href="#spark" transform="translate(248 247) scale(1.9)"/>
    <use href="#spark" transform="translate(287 195) scale(1.9)"/>
  </g>
  <g fill="#fff" filter="url(#glow)">
    <use href="#spark" transform="translate(200 265) scale(.9)"/><use href="#spark" transform="translate(113 195) scale(.7)"/><use href="#spark" transform="translate(287 195) scale(.7)"/>
  </g>
</svg>
