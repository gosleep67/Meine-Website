<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".85"><stop offset="0" stop-color="#f7f2ea"/><stop offset="1" stop-color="#ddd2c3"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e3a0"/><stop offset=".5" stop-color="#d9a93f"/><stop offset="1" stop-color="#a7771f"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3f0fa"/><stop offset="1" stop-color="#b4d2e8"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <path id="arc" d="M90 70 C90 330 310 330 310 70"/>
    <g id="leaf">
      <path d="M-25 0 Q0 -12 25 0 Q0 12 -25 0Z" fill="url(#stone)" stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M-25 0 L25 0 M-12 -4.5 L0 0 L-12 4.5 M12 -4.5 L0 0 L12 4.5" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".9"/>
    </g>
    <path id="spark" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9Z"/>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- weicher Schatten -->
  <use href="#arc" transform="translate(5 9)" fill="none" stroke="#5a4630" stroke-opacity=".28" stroke-width="5" filter="url(#blur)"/>
  <ellipse cx="205" cy="290" rx="78" ry="13" fill="#5a4630" fill-opacity=".3" filter="url(#blur)"/>

  <!-- feine Gliederkette -->
  <use href="#arc" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6.5 2.2"/>
  <use href="#arc" fill="none" stroke="#fff6cf" stroke-opacity=".75" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 5.7" transform="translate(0 -1)"/>

  <!-- Anhänger -->
  <use href="#leaf" transform="translate(128 258) rotate(-34)"/>
  <use href="#leaf" transform="translate(272 258) rotate(34)"/>
  <use href="#leaf" transform="translate(160 268) rotate(-15)"/>
  <use href="#leaf" transform="translate(240 268) rotate(15)"/>
  <g transform="translate(200 266)">
    <use href="#leaf" transform="rotate(0) translate(0 -14) rotate(90) scale(.62)"/>
    <use href="#leaf" transform="rotate(72) translate(0 -14) rotate(90) scale(.62)"/>
    <use href="#leaf" transform="rotate(144) translate(0 -14) rotate(90) scale(.62)"/>
    <use href="#leaf" transform="rotate(216) translate(0 -14) rotate(90) scale(.62)"/>
    <use href="#leaf" transform="rotate(288) translate(0 -14) rotate(90) scale(.62)"/>
    <circle r="8" fill="url(#gold)" stroke="#a7771f" stroke-width=".8"/>
    <circle r="3.4" fill="url(#stone)"/>
  </g>

  <!-- Glitzern -->
  <g fill="#fff" filter="url(#glow)" opacity=".95">
    <use href="#spark" transform="translate(120 250) scale(1.1)"/>
    <use href="#spark" transform="translate(209 244) scale(.9)"/>
    <use href="#spark" transform="translate(262 270) scale(.8)"/>
  </g>
  <g fill="#fff">
    <use href="#spark" transform="translate(120 250) scale(.8)"/>
    <use href="#spark" transform="translate(209 244) scale(.65)"/>
    <use href="#spark" transform="translate(262 270) scale(.6)"/>
  </g>
</svg>
