<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".85"><stop offset="0" stop-color="#f7f2ea"/><stop offset="1" stop-color="#ddd2c3"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e3a0"/><stop offset=".5" stop-color="#d9a93f"/><stop offset="1" stop-color="#a7771f"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <path id="heart" d="M0 13 C-19 -1 -15 -17 -7 -17 C-3 -17 0 -14 0 -11 C0 -14 3 -17 7 -17 C15 -17 19 -1 0 13Z"/>
    <path id="spark" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9Z"/>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="206" cy="330" rx="78" ry="12" fill="#5a4630" fill-opacity=".3" filter="url(#blur)"/>
  <circle cx="205" cy="243" r="80" fill="none" stroke="#5a4630" stroke-opacity=".3" stroke-width="7" filter="url(#blur)"/>
  <circle cx="200" cy="235" r="80" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="200" cy="235" r="80" fill="none" stroke="#fff6cf" stroke-opacity=".6" stroke-width="1.6" transform="translate(0 -2)"/>
  <g fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linejoin="round" transform="translate(200 158) scale(1.9)">
    <use href="#heart" transform="translate(-9 2) rotate(-14)"/>
    <use href="#heart" transform="translate(9 4) rotate(14)"/>
  </g>
  <g fill="#fff" filter="url(#glow)"><use href="#spark" transform="translate(228 128) scale(1)"/></g>
  <g fill="#fff"><use href="#spark" transform="translate(228 128) scale(.75)"/></g>
</svg>
