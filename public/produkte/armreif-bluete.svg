<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".85"><stop offset="0" stop-color="#f7f2ea"/><stop offset="1" stop-color="#ddd2c3"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e3a0"/><stop offset=".5" stop-color="#d9a93f"/><stop offset="1" stop-color="#a7771f"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde6ec"/><stop offset=".6" stop-color="#f4b7c9"/><stop offset="1" stop-color="#e48fab"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <path id="c1" d="M300 125 A115 105 0 1 0 300 295"/>
    <path id="c2" d="M262 178 A78 70 0 1 0 262 245"/>
    <path id="spark" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9Z"/>
    <g id="leaf">
      <path d="M-25 0 Q0 -12 25 0 Q0 12 -25 0Z" fill="url(#pink)" stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M-25 0 L25 0 M-12 -4.5 L0 0 L-12 4.5 M12 -4.5 L0 0 L12 4.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".9"/>
    </g>
    <g id="petal"><path d="M0 -3 Q11 -17 0 -34 Q-11 -17 0 -3Z" fill="url(#pink)" stroke="url(#gold)" stroke-width="1.8" stroke-linejoin="round"/><path d="M0 -6 L0 -30 M0 -17 L-5 -22 M0 -17 L5 -22" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width=".8"/></g>
    <g id="flower"><use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/><circle r="5.5" fill="url(#gold)"/><circle r="2.4" fill="#fff"/></g>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#5a4630" stroke-opacity=".28" stroke-width="9" filter="url(#blur)" transform="translate(6 10)"><use href="#c1"/><use href="#c2"/></g>
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"><use href="#c1"/><use href="#c2"/></g>
  <g fill="none" stroke="#fff6cf" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round" transform="translate(0 -2)"><use href="#c1"/><use href="#c2"/></g>
  <use href="#flower" transform="translate(300 125) scale(.95) rotate(10)"/>
  <use href="#flower" transform="translate(300 295) scale(.95) rotate(-15)"/>
  <use href="#flower" transform="translate(262 178) scale(.72) rotate(20)"/>
  <use href="#flower" transform="translate(262 245) scale(.72) rotate(-5)"/>
  <g fill="#fff" filter="url(#glow)"><use href="#spark" transform="translate(318 108) scale(.9)"/><use href="#spark" transform="translate(280 312) scale(.8)"/></g>
  <g fill="#fff"><use href="#spark" transform="translate(318 108) scale(.65)"/><use href="#spark" transform="translate(280 312) scale(.55)"/></g>
</svg>
